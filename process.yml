name: StreamVault Process (Leve)

# ═══════════════════════════════════════════════════════════════════════
# VERSÃO "LEVE" — variante do process.yml, não substitui o original.
# Objetivo: reduzir tempo total de execução e redundâncias que aumentam
# desnecessariamente a superfície de atividade visível na conta GitHub,
# sem tocar na arquitetura (branch exclusiva por job, sharding, etc.).
#
# ADENDO — TROCA DO MOTOR BITTORRENT (libtorrent → aria2):
#   A partir desta revisão, todo o mecanismo BitTorrent deste ficheiro
#   passa a usar `aria2c` (build de referência: aria2 1.37.0, com
#   BitTorrent/DHT/HTTPS habilitados) em vez de libtorrent/Python.
#   MUDANÇA ARQUITETURAL IMPORTANTE: a normalização/validação de Magnet
#   link NÃO vive mais (nunca viveu, mas agora é explícito) aqui dentro —
#   ela acontece no Worker de ingest (lotes-worker.js), em
#   handleUploadEvent(), ANTES do job entrar na fila e ANTES de qualquer
#   /dispatch. Este YML — Coordinator e job `process` — só deve receber
#   `inputs.video_url` já normalizado/validado (magnet canônico, URL de
#   .torrent, ou URL directa). NÃO existe (nem deve ser adicionada) uma
#   segunda normalização de Magnet aqui — se um magnet malformado chegar
#   até este ponto, isso é um bug na camada de validação do Worker, não
#   algo para o runner tentar adivinhar/corrigir.
#   DHT continua habilitado (nunca removido). A obtenção de metadata
#   continua conceptualmente separada do download do conteúdo (ver o
#   job `coordinator`, que só pede metadata, nunca o conteúdo).
#   FILE_INDICES — NOTA DE CONTRATO INTERNA: com libtorrent os índices de
#   ficheiro dentro de um torrent eram 0-indexed (fs.file_path(i) começa
#   em 0). aria2c usa `--select-file` 1-indexed. Como file_indices é um
#   campo interno, produzido pelo Coordinator e consumido só pelo job
#   `process` do MESMO pipeline (nunca exposto a fora, nunca um contrato
#   externo), a partir desta revisão ele passa a ser gerado e consumido
#   em base 1 (convenção do aria2), documentado nos dois pontos onde é
#   usado abaixo. Nenhum outro campo/segredo/artifact/nome de job foi
#   alterado.
#
# DIFERENÇAS EM RELAÇÃO AO process.yml:
#
#   1. STREAM COPY CONDICIONAL (vídeo E áudio, decisões INDEPENDENTES)
#      Reaproveita o PROBE_CODEC/PROBE_AUDIO_CODEC já extraídos no step
#      "Probe do vídeo" — não é uma nova etapa de detecção, é parar de
#      descartar dados que já existiam. Vídeo: se a fonte já é h264, usa
#      `-c:v copy`. Áudio: SÓ usa `-c:a copy` se a fonte já for AAC —
#      são decisões separadas porque vídeo e áudio são codecs
#      independentes (um BluRay "DUAL" pode ter vídeo h264 + áudio
#      AC3/DTS). Copiar áudio não-AAC faz o MSE do navegador rejeitar o
#      primeiro segmento sem nenhum erro do lado do ffmpeg — bug real já
#      encontrado em teste com conteúdo real (loop infinito no primeiro
#      .bin). Caso contrário (codec não suportado em copy), sempre
#      re-encoda pra AAC 128k, mesmo com vídeo em stream copy.
#      TRADE-OFF CONHECIDO: com -c:v copy, -g/-keyint_min não têm
#      efeito (só existem no encoder) — os segmentos HLS cortam nos
#      keyframes que já existem na fonte, não em seg_duration exato.
#      Alguns segmentos podem sair maiores que o alvo. Fallback: se o
#      stream copy (vídeo ou áudio) falhar no próprio ffmpeg (raro —
#      container incompatível), cai para re-encode completo automático.
#
#   2. EARLY_FAIL_TIMEOUT: 180s → 45s (coordinator e download torrent)
#      Se um tracker/DHT vai responder, responde nos primeiros 15-30s.
#      180s de espera morta num torrent sem seeders só queima minutos
#      do plano sem necessidade.
#      [Nota pós-aria2: esta secção descreve a filosofia original do
#      libtorrent — com aria2c não existe mais um temporizador próprio
#      de "early fail" no código deste YML; quem decide quando desistir
#      é sempre o teto timeout-minutes do job (ver item 4 e o ADENDO
#      acima), exactamente como o fix cirúrgico do item 4 já preconizava.]
#
#   3. Retries reduzidos onde a falha raramente é persistente:
#      - dispatch_child (coordinator → episódios): 4 tentativas → 3,
#        espera [10, 30, 60]s → [10, 25]s.
#      - Webhook de notificação ao dispatcher: --retry 3 → 2,
#        --retry-delay 5 → 3 (é só informativo, não crítico ao job).
#
#   RETRIES MANTIDOS SEM ALTERAÇÃO (propositalmente):
#      - Registo no EdgeOne (5 tentativas) — ambiente serverless pode
#        estar em sleep.
#      - Git push do shard (8 tentativas por lote, dentro de UM shard)
#        — única operação onde falha transitória de rede é comum e cara
#        de recomeçar do zero.
#      - get_repo_size_kb (4 tentativas) — lida com rate-limit
#        secundário real da API do GitHub.
#
#   4. FIX CIRÚRGICO (patch anterior): a condição de "early fail" baseada
#      em dht_nodes==0 nunca disparava na prática — removida, abort
#      cedo agora é só o timeout-minutes: 45 do job inteiro.
#
#   5. FIX CIRÚRGICO (patch anterior — shard cheio):
#      "Repository is above its size quota" é um erro PERMANENTE do
#      pre-receive hook do GitHub, não transitório. O retry antigo
#      tratava esse erro do mesmo jeito que uma falha de rede — 8
#      tentativas com backoff até ~70s cada, sempre contra o MESMO
#      shard, sempre fadadas a falhar do mesmo jeito. A causa raiz é
#      que o campo `size` da API do GitHub (usado por pick_shard() pra
#      decidir se um shard tem espaço) pode estar desatualizado na hora
#      da escolha — GitHub atualiza esse valor com atraso, especialmente
#      sob push concorrente de vários jobs pro mesmo shard. Ou seja: um
#      shard pode passar no filtro de 3.5GB e mesmo assim já estar cheio
#      no servidor no momento do push real.
#      Fix: os steps "Escolher shard", "Reescrever URLs" e "Commit+push"
#      foram fundidos num único step com loop de fallback. Se o push
#      falhar com erro de quota, o shard é marcado como cheio nesta run
#      e o job escolhe automaticamente outro shard (ou cria um novo),
#      regenera as URLs (index.m3u8/master.m3u8/cdn_urls.json) pro novo
#      shard, e tenta de novo — até 5 shards diferentes antes de desistir.
#      Falhas de rede genuínas (não-quota) continuam com os mesmos 8
#      retries por lote de antes, dentro do shard atual.
#
#   6. FIX CIRÚRGICO (patch anterior — numeração/catálogo de episódios):
#      Quando os episódios de uma série chegam como links separados
#      (um torrent por episódio, ex.: link A = ep1, link B = ep2), CADA
#      chamada ao coordinator processa um torrent com 1 único ficheiro
#      de vídeo. Antes, o coordinator IGNORAVA completamente o input
#      `episode_number` fornecido pelo chamador e tentava adivinhar o
#      número via regex no nome do ficheiro — e quando o nome não tinha
#      um padrão reconhecível (comum em releases sem SxxExx no filename),
#      caía no fallback `counter = 1`, sempre reiniciando do zero a cada
#      chamada isolada (é exatamente o "reseta como 1 ep" relatado).
#      Fix: quando o torrent tem exatamente 1 ficheiro de vídeo E o
#      chamador forneceu `episode_number` explícito (não vazio, != '0'),
#      esse valor tem prioridade absoluta sobre qualquer tentativa de
#      adivinhar pelo nome do ficheiro. A detecção por regex/fallback
#      continua a existir só para o caso real de batch multi-episódio
#      num único torrent, onde não há como o chamador saber os números
#      de antemão. Também foi adicionado um aviso explícito quando
#      `metadata.contentId` vem vazio — causa mais provável de episódios
#      da mesma série virarem entradas separadas no catálogo, porque cada
#      job cai de volta pro próprio job_id (único por definição) como ID.
#
#   7. FIX CIRÚRGICO (patch anterior — dispatch de episódios PARALELO → SEQUENCIAL):
#      O `dispatch_child` já era chamado dentro de um `for`, uma chamada
#      de cada vez (não havia concorrência no ato de disparar). O
#      problema real é outro: `workflow_dispatch` só ENFILEIRA a run —
#      cada run filha começa a executar (e a consumir um runner) de
#      forma independente das outras, assim que o GitHub processa o
#      dispatch. Com o intervalo antigo de 1.5s entre disparos, todas as
#      runs de episódios ficavam ativas praticamente ao mesmo tempo —
#      várias runs concorrentes disputando o mesmo repositório de
#      destino (mesmo shard, mesma API), aumentando a chance de conflito
#      de push e de rate-limit correlacionado. Fix: intervalo entre
#      disparos elevado de 1.5s para DISPATCH_INTERVAL_SECONDS = 20min,
#      fazendo os episódios começarem a rodar de forma escalonada, não
#      em rajada.
#      IMPORTANTE: é um temporizador FIXO, não uma espera condicional —
#      o coordinator não verifica se a run anterior já terminou, só
#      conta os 20min e dispara a próxima. Se um job individual levar
#      mais que 20min (até o teto de timeout-minutes: 45), o próximo já
#      terá sido disparado antes dele acabar — as duas runs ficam ativas
#      ao mesmo tempo por um período. Isso é seguro porque cada job
#      escreve numa branch exclusiva (job-<job_id>), sem colisão de
#      escrita entre elas — só overlap de runners/API.
#      ★ SUBSTITUÍDO pelo fix 9c mais abaixo — o "overlap de runners"
#      aceite aqui deixou de ser aceitável depois dos lotes C/D (ver
#      9c): agora espera-se confirmação real de conclusão antes do
#      próximo disparo, nunca mais um temporizador fixo. Descrição
#      mantida por historial.
#
#   8. FIX CIRÚRGICO (patch anterior — dorama deixa de ser "episódico"):
#      Só 'dorama' saiu da condição de acionamento do [Coordinator]
#      abaixo — 'series' e 'anime' continuam a acionar normalmente a
#      detecção/separação de episódios a partir de um torrent, sem
#      nenhuma mudança de comportamento. Motivo: o frontend
#      (watch/[id]/page.tsx e content/[id]/page.tsx) já tratava só
#      'dorama' como conteúdo UNITÁRIO desde a mudança de rótulo pra
#      "Animações" (sem seletor de temporada/episódio, nunca envia
#      `?episode=` no pedido de stream) — mas o coordinator continuava a
#      gravar a playlist desses títulos sob a chave do EPISÓDIO
#      (stealth_playlist_{contentId}_s{n}_e{n}), nunca sob a chave do
#      contentId puro. Resultado: `/api/content/:id/stream` sempre
#      devolvia 404 "Stream metadata not found" pra títulos "Animações"
#      (ex-dorama), porque nenhum registo existia sob a chave que o
#      frontend pedia. 'anime' NUNCA teve esse descompasso — o frontend
#      sempre tratou 'anime' como episódico normalmente — por isso fica
#      no Coordinator, sem alteração nenhuma.
#      Agora dorama entra sempre com season_number/episode_number = '0'
#      (via ingest.html → lotes A/B, igual filme/documentário) — o
#      Coordinator não é acionado, o job processa o torrent/URL como um
#      vídeo único, e o registo no EdgeOne fica sob o contentId puro,
#      exatamente como o frontend espera.
#      ATENÇÃO — trade-off assumido: sem o Coordinator, um torrent batch
#      de dorama (vários ficheiros de vídeo num só magnet) NÃO é mais
#      separado — o step "Detectar ficheiro de vídeo" abaixo pega sempre
#      o PRIMEIRO vídeo encontrado e ignora o resto. Cada título dorama/
#      "Animações" deve ser submetido como 1 torrent/URL por vídeo (um
#      magnet por filme/OVA), nunca um torrent com vários ficheiros de
#      uma vez. 'series' e 'anime' não têm essa limitação — continuam
#      processando batches normalmente pelo Coordinator.
#
#   9. FIX CIRÚRGICO (este patch — versão final, substitui 2 tentativas
#      anteriores descartadas, ver histórico completo abaixo):
#
#      9a. episode_count — pro caso "1 link cobre N episódios" (torrent
#          com N ficheiros de vídeo pertencentes à MESMA submissão).
#          Quando o chamador informa episode_number (início) E
#          episode_count (quantos), E o número de ficheiros de vídeo
#          encontrados no torrent bate exactamente com episode_count, a
#          numeração é SEQUENCIAL e DETERMINÍSTICA (episode_number,
#          episode_number+1, ...) pela ORDEM DOS FICHEIROS DENTRO DO
#          TORRENT — nunca por regex/adivinhação no nome. Se não bater,
#          cai de volta pro modo automático antigo (regex/contador) com
#          aviso explícito no log. O caso "1 link = 1 episódio"
#          (episode_count=1, já suportado desde o fix #6) continua
#          idêntico. Cálculo 100% LOCAL, dentro do próprio Coordinator —
#          nenhuma chamada de rede nova, nenhuma dependência nova.
#          Isto cobre 2 das 3 categorias de link que o Coordinator
#          precisa suportar: (1) link ambíguo, só se sabe 1-ou-N ao
#          sondar o torrent — episode_count=1 (default), regex/contador
#          decide; (2) link único DECLARADO com N episódios — episode_
#          count>1 vindo do multi-link do ingest.html, numeração
#          determinística. A 3ª categoria (link onde nem se conhece N —
#          nem por declaração, nem por sondagem simples) NÃO está
#          implementada, aqui nem em nenhum patch anterior — fica só
#          como gap conhecido pra o dia em que isso for pedido.
#
#      9b. LIMITE RÍGIDO DE 10 INPUTS DO workflow_dispatch — achado
#          crítico de plataforma (confirmado na documentação do GitHub,
#          não assumido): um workflow com mais de 10 inputs declarados é
#          INVÁLIDO — o GitHub recusa registá-lo, nunca chega sequer a
#          correr. Este ficheiro já tinha chegado a 11 (job_id,
#          video_url, thumbnail_url, seg_duration, max_encode_height,
#          metadata, season_number, episode_number, episode_title,
#          file_indices, episode_count) sem que isso tivesse sido
#          detectado — só apareceu ao planear mais 2 campos novos pra
#          9d, abaixo, o que pioraria ainda mais a situação.
#          Fix: os inputs foram consolidados em 6 — job_id, video_url e
#          metadata ficam como estavam; os restantes agrupam-se em 3
#          blobs JSON por afinidade:
#            episode_info -> season_number, episode_number,
#                             episode_title, file_indices, episode_count
#            encode_opts  -> seg_duration, max_encode_height,
#                             thumbnail_url
#            chain        -> remaining_children, chain_root_id (só usado
#                             pela cadeia sequencial — ver 9d)
#          A consolidação fica confinada a este ficheiro e ao /dispatch
#          do dispatcher.js (que continua a aceitar os campos separados
#          de sempre do Worker/ingest.html — zero mudança nesses dois —
#          só os agrupa em JSON antes de enviar ao GitHub).
#
#      9c. HISTÓRICO DE 2 TENTATIVAS DESCARTADAS (mantido por registo —
#          não fazem parte do comportamento actual):
#          (i) Coordinator chamando o dispatcher.js pra cada filho, com
#              parent_job/batch_total, pra dar visibilidade de filhos ao
#              dispatcher — rejeitado: cria dependência do Coordinator
#              num serviço Render de plano gratuito, que dorme por
#              inactividade; um cold-start no meio do disparo de
#              episódios já causou falha real em produção (HTTP 000).
#          (ii) Coordinator em job separado com timeout de 8h,
#              disparando TODOS os filhos com espaçamento fixo de 20min
#              e depois fazendo polling directo à API do GitHub
#              (run-name + status do run) até cada um confirmar
#              conclusão antes do próximo — funcionalmente correcto,
#              mas exigia o Coordinator ficar vivo (a dormir) por horas,
#              ocupando 1 slot de runner concorrente da conta o tempo
#              todo, só pra sondar estado. Substituído por 9d, que
#              elimina essa necessidade.
#
#      9d. CADEIA SEQUENCIAL — SOLUÇÃO FINAL. Em vez do Coordinator
#          disparar (ou sondar) todos os episódios, ele sonda o torrent,
#          calcula a lista COMPLETA de episódios/batches, mas dispara só
#          o PRIMEIRO — anexando ao payload desse 1º episódio, no campo
#          `chain`, a lista dos restantes (`remaining_children`) e o
#          `chain_root_id` (= o próprio job_id do Coordinator, que é o
#          id que o lote C/D está de facto a rastrear). O Coordinator
#          TERMINA logo a seguir — já não fica à espera de nada, volta
#          a ter um timeout modesto (60min, só cobre a sondagem do
#          torrent, que é o único tempo genuinamente imprevisível aqui).
#          Cada episódio, DEPOIS de terminar o seu próprio trabalho
#          (encode/push/registo — já terminou de facto, não é polling
#          nem temporizador fixo, é só o próprio código só correr depois
#          disso), executa o novo step "Continuar cadeia sequencial" no
#          job `process`: se `remaining_children` ainda tiver itens,
#          espera um gap aleatório de 10-30min (mesmo padrão do lote
#          A/B pros filmes) e dispara o PRÓXIMO directo na API do GitHub
#          — repassando o resto da lista e o mesmo chain_root_id; se não
#          sobrar nada (é o último), fecha o chain_root_id como
#          concluído através do MESMO /webhook que o dispatcher.js já
#          tinha (nenhum endpoint novo). NUNCA 2 episódios em paralelo,
#          por construção.
#          FIX TRADE-OFF 1 (lote avançava rápido demais com o Coordinator
#          leve): o Coordinator, ao disparar o 1º episódio com sucesso,
#          NÃO reporta o seu próprio job_id como concluído — o webhook
#          dele só dispara em falha/cancelamento. O jobStore desse
#          job_id fica deliberadamente 'dispatched' até o ÚLTIMO elo da
#          cadeia o fechar — o lote só avança quando a série TODA já
#          passou pela cadeia.
#          FIX TRADE-OFF 2 (fragilidade da cadeia): se o disparo do
#          próximo episódio falhar (retries esgotados), esse elo fecha
#          IMEDIATAMENTE o chain_root_id como 'failed' e loga com
#          precisão quais job_ids nunca chegaram a ser disparados —
#          destrava o lote em minutos em vez de esperar um teto de
#          segurança de horas.
#          NÃO CHAMA O DISPATCHER/RENDER pra disparar nada — só o
#          fecho final (done/failed) do chain_root_id usa o /webhook já
#          existente, exactamente como qualquer job sempre reportou o
#          seu próprio fim.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    # Consolidado em 6 inputs — limite RÍGIDO do GitHub é 10, ver fix 9b
    # no cabeçalho. job_id/video_url/metadata ficam simples; o resto
    # agrupa-se em 3 blobs JSON por afinidade.
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'URL do vídeo — HTTP(S), magnet: (já normalizado/validado pelo Worker de ingest), .torrent'
        required: false
        default: ''
      metadata:
        description: 'JSON: { contentId, title, description, type, year, lang }'
        required: false
        default: '{}'
      episode_info:
        description: 'JSON: { season_number, episode_number, episode_title, file_indices, episode_count } — file_indices é 1-indexed (convenção aria2 --select-file)'
        required: false
        default: '{"season_number":"0","episode_number":"0","episode_title":"","file_indices":"","episode_count":"1"}'
      encode_opts:
        description: 'JSON: { seg_duration, max_encode_height, thumbnail_url }'
        required: false
        default: '{"seg_duration":"4","max_encode_height":"720","thumbnail_url":""}'
      chain:
        description: 'JSON: { remaining_children, chain_root_id } — uso interno da cadeia sequencial de episódios (ver fix 9d)'
        required: false
        default: '{"remaining_children":[],"chain_root_id":""}'

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # COORDINATOR — job separado, timeout próprio de 60min (ver fix 9d).
  # Só roda pra séries/animes com link torrent/magnet e sem file_indices
  # (filhos de episódio já vêm com file_indices preenchido — nunca caem
  # aqui, vão direto pro job "process" abaixo, exactamente como sempre).
  # ═══════════════════════════════════════════════════════════════════
  coordinator:
    if: |
      inputs.video_url != '' &&
      fromJson(inputs.episode_info).file_indices == '' &&
      (
        contains(fromJson(inputs.metadata).type, 'series') ||
        contains(fromJson(inputs.metadata).type, 'anime')
      ) &&
      (
        startsWith(inputs.video_url, 'magnet:') ||
        endsWith(inputs.video_url, '.torrent')  ||
        contains(inputs.video_url, 'infohash:')
      )
    runs-on: ubuntu-latest
    # 60min — só cobre a sondagem do torrent (metadados) + o disparo do
    # 1º episódio, que é tudo o que este job faz agora (fix 9d). Já não
    # precisa de 8h: não fica mais vivo à espera de nada, o resto da
    # cadeia é responsabilidade de cada episódio, um de cada vez.
    timeout-minutes: 60
    # actions:write necessário pro coordinator disparar episódios filhos
    # no próprio repo usando o GITHUB_TOKEN automático — workflow_dispatch
    # é uma das exceções documentadas em que o token padrão do Actions
    # PODE disparar outro workflow run (diferente de push/etc, que não
    # disparam pra evitar loops infinitos).
    permissions:
      actions: write
      contents: read
    env:
      DISPATCHER_URL: ${{ secrets.DISPATCHER_URL }}
      ADMIN_API_KEY:  ${{ secrets.ADMIN_API_KEY }}
    steps:
      # TROCA aria2 (era: instalar libtorrent) — este job nunca faz
      # download de conteúdo, só pede metadata (ver step abaixo).
      - name: Instalar aria2 (cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: aria2
          version: 1.0
          execute_install_scripts: true

      - name: Verificar aria2c
        run: aria2c --version | head -3

      - name: '[Coordinator] Obter metadata via aria2c (bt-metadata-only)'
        env:
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p /tmp/coord_meta
          echo "[bitTorrent] engine=aria2"
          echo "[bitTorrent] metadata requested"
          # bt-metadata-only+bt-save-metadata: pede SÓ os metadados (o
          # .torrent embutido no magnet via DHT/trackers) — nunca inicia
          # o download do conteúdo em si. aria2 grava "<infohash>.torrent"
          # em --dir e termina sozinho assim que a metadata chega. Sem
          # abort cedo por peers/DHT aqui de propósito — quem decide
          # "desistir" é sempre o timeout-minutes: 60 deste job (mesma
          # filosofia do fix cirúrgico #4 do cabeçalho: não dá pra prever
          # com confiança quando um torrent vai achar seed).
          aria2c \
            --dir=/tmp/coord_meta \
            --bt-metadata-only=true \
            --bt-save-metadata=true \
            --enable-dht=true \
            --enable-dht6=false \
            --bt-enable-lpd=true \
            --seed-time=0 \
            --summary-interval=15 \
            --console-log-level=notice \
            --file-allocation=none \
            "$INPUT_VIDEO_URL" || {
              echo "ERRO: aria2c não conseguiu obter metadata (não é problema de normalização — o Worker de ingest já validou a estrutura do magnet; isto é disponibilidade de peers/trackers)"
              exit 1
            }

      - name: '[Coordinator] Detectar episódios e disparar 1º job filho (cadeia sequencial)'
        env:
          INPUT_METADATA:      ${{ inputs.metadata }}
          INPUT_VIDEO_URL:     ${{ inputs.video_url }}
          INPUT_EPISODE_INFO:  ${{ inputs.episode_info }}
          INPUT_ENCODE_OPTS:   ${{ inputs.encode_opts }}
          JOB_ID_SELF:         ${{ inputs.job_id }}
          # workflow_dispatch é uma exceção documentada — o GITHUB_TOKEN
          # automático PODE disparar outro workflow_dispatch no mesmo
          # repo (diferente de eventos como push, que não disparam, pra
          # evitar loops infinitos). Elimina a necessidade de token
          # próprio só pra esse self-dispatch.
          STORAGE_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, sys, re, json, glob, time, subprocess

          url          = os.environ['INPUT_VIDEO_URL']
          metadata_raw = os.environ['INPUT_METADATA']

          # FIX 9b: episode_info/encode_opts chegam como blobs JSON
          # (consolidação pra respeitar o limite de 10 inputs do
          # workflow_dispatch — ver cabeçalho do ficheiro).
          try:    episode_info = json.loads(os.environ.get('INPUT_EPISODE_INFO', '') or '{}')
          except: episode_info = {}
          try:    encode_opts  = json.loads(os.environ.get('INPUT_ENCODE_OPTS', '') or '{}')
          except: encode_opts  = {}

          season_num   = int(episode_info.get('season_number', '0') or '0')
          input_episode_raw = (episode_info.get('episode_number', '') or '').strip()
          input_episode      = int(input_episode_raw) if input_episode_raw.isdigit() and input_episode_raw != '0' else None
          input_ep_title      = episode_info.get('episode_title', '') or ''
          input_episode_count_raw = (episode_info.get('episode_count', '') or '1').strip()
          input_episode_count = int(input_episode_count_raw) if input_episode_count_raw.isdigit() and input_episode_count_raw != '0' else 1
          VIDEO_EXTS   = {'.mp4','.mkv','.avi','.mov','.wmv','.flv','.ts','.m4v','.webm','.mpg','.mpeg'}
          BATCH_LIMIT  = 1_400 * 1024 * 1024

          try:    metadata = json.loads(metadata_raw)
          except: metadata = {}
          content_id = metadata.get('contentId') or ''
          if not content_id:
            print("  ⚠ metadata.contentId vazio — o ID será derivado do título. Se o título "
                  "variar minimamente entre submissões do MESMO conteúdo (espaços, maiúsculas, "
                  "pontuação), cada submissão vira uma entrada DIFERENTE no catálogo. Prefira "
                  "sempre passar contentId explícito ao juntar episódios da mesma série/filme.")

          print(f"Coordinator: {metadata.get('title','?')} S{season_num:02d} | {url[:70]}...")

          # ── Bencode decoder mínimo (sem dependências) — substitui o
          # parsing que libtorrent fazia internamente. Só o suficiente
          # pra ler o dicionário 'info' de um .torrent: name/length/files.
          def bdecode(data):
            def decode(i):
              c = data[i:i+1]
              if c == b'i':
                end = data.index(b'e', i)
                return int(data[i+1:end]), end + 1
              if c == b'l':
                i += 1
                out = []
                while data[i:i+1] != b'e':
                  v, i = decode(i)
                  out.append(v)
                return out, i + 1
              if c == b'd':
                i += 1
                out = {}
                while data[i:i+1] != b'e':
                  k, i = decode(i)
                  v, i = decode(i)
                  out[k] = v
                return out, i + 1
              colon = data.index(b':', i)
              length = int(data[i:colon])
              start = colon + 1
              return data[start:start + length], start + length
            value, _ = decode(0)
            return value

          torrent_files = glob.glob('/tmp/coord_meta/*.torrent')
          if not torrent_files:
            print("ERRO: nenhum .torrent de metadata encontrado em /tmp/coord_meta — aria2c "
                  "deveria ter gravado um (--bt-save-metadata=true)")
            sys.exit(1)

          with open(torrent_files[0], 'rb') as f:
            raw = f.read()
          meta = bdecode(raw)
          info = meta[b'info']
          torrent_name = info.get(b'name', b'unknown')
          if isinstance(torrent_name, bytes):
            torrent_name = torrent_name.decode('utf-8', 'replace')

          video_files = []
          if b'files' in info:
            # Multi-file — índice 1-based (convenção aria2 --select-file;
            # ver ADENDO no cabeçalho do ficheiro).
            for idx, fentry in enumerate(info[b'files'], start=1):
              parts = [p.decode('utf-8', 'replace') if isinstance(p, bytes) else str(p) for p in fentry[b'path']]
              rel_path = '/'.join(parts)
              size = int(fentry[b'length'])
              ext = os.path.splitext(rel_path)[1].lower()
              if ext in VIDEO_EXTS:
                video_files.append({'index': idx, 'path': rel_path, 'size': size, 'name': os.path.basename(rel_path)})
            total_files = len(info[b'files'])
          else:
            size = int(info[b'length'])
            ext = os.path.splitext(torrent_name)[1].lower()
            if ext in VIDEO_EXTS:
              video_files.append({'index': 1, 'path': torrent_name, 'size': size, 'name': torrent_name})
            total_files = 1

          print(f"  Metadados OK: {torrent_name} | {total_files} ficheiro(s) | vídeos: {len(video_files)}")

          if not video_files:
            print("ERRO: nenhum ficheiro de vídeo nos metadados")
            sys.exit(1)

          def extract_ep(name):
            base = os.path.splitext(name)[0]
            patterns = [
              r'[Ss]\d+[Ee](\d+)',
              r'[Ee][Pp]?[\s._-]?(\d{1,3})',
              r'[\s._-](\d{2,3})[\s._-]',
              r'^(\d{1,3})[\s._-]',
              r'[\s._-](\d{1,3})\.',
            ]
            for pat in patterns:
              m = re.search(pat, base, re.IGNORECASE)
              if m: return int(m.group(1))
            return None

          # FIX 9a: quando o chamador informou episode_number (início) E
          # episode_count>1, E o número de ficheiros de vídeo encontrados
          # bate exactamente — numeração sequencial determinística pela
          # ordem dos ficheiros no torrent, sem NENHUMA tentativa de
          # adivinhar pelo nome.
          if input_episode is not None and len(video_files) == input_episode_count and input_episode_count > 1:
            for i, vf in enumerate(video_files):
              vf['ep_num'] = input_episode + i
            print(f"  {len(video_files)} ficheiro(s) == episode_count esperado ({input_episode_count}) — "
                  f"numerando sequencialmente a partir de ep{input_episode:02d} pela ordem dos ficheiros "
                  f"no torrent (ignorando qualquer padrão no nome)")
          elif len(video_files) == 1 and input_episode is not None:
            video_files[0]['ep_num'] = input_episode
            print(f"  Episódio único com episode_number explícito: usando ep{input_episode:02d} "
                  f"(ignorando qualquer padrão no nome do ficheiro)")
          else:
            if input_episode is not None and input_episode_count > 1:
              print(f"  ⚠ episode_count={input_episode_count} não bate com {len(video_files)} ficheiro(s) "
                    f"de vídeo encontrado(s) no torrent — voltando pro modo automático (regex/contador), "
                    f"a numeração pode sair errada. Confira o link e o episode_count enviados.")
            for vf in video_files:
              vf['ep_num'] = extract_ep(vf['name'])

            used_nums = {v['ep_num'] for v in video_files if v['ep_num'] is not None}
            counter   = 1
            for vf in video_files:
              if vf['ep_num'] is None:
                while counter in used_nums:
                  counter += 1
                vf['ep_num'] = counter
                used_nums.add(counter)
                counter += 1

          # Ordena sempre por ep_num antes de batchear — garante que a
          # ordem de disparo da cadeia sequencial segue a ordem dos
          # episódios, não a ordem bruta em que o torrent lista os
          # ficheiros (ver histórico do fix no ficheiro original).
          video_files.sort(key=lambda vf: vf['ep_num'])

          for vf in video_files:
            print(f"  [idx {vf['index']:2d}] ep{vf['ep_num']:02d} | {vf['name']} | {vf['size']//(1024*1024)}MB")

          def est(size):
            return int(size * 0.55 * 1.17)

          batches, cur, cur_size = [], [], 0
          for vf in video_files:
            e = est(vf['size'])
            if cur and cur_size + e > BATCH_LIMIT:
              batches.append(cur)
              cur, cur_size = [vf], e
            else:
              cur.append(vf)
              cur_size += e
          if cur: batches.append(cur)

          print(f"  Batches: {len(batches)}")
          for i, b in enumerate(batches):
            print(f"    Batch {i+1}: eps {[v['ep_num'] for v in b]} | ~{sum(v['size'] for v in b)//(1024*1024)}MB raw")

          safe_cid = re.sub(r'[^a-z0-9-]', '', (content_id or metadata.get('title','serie'))[:20].replace(' ','-').lower())

          children = []
          for bi, batch in enumerate(batches):
            # 1-indexed (aria2 --select-file) — ver ADENDO no topo do ficheiro.
            indices_str = ','.join(str(v['index']) for v in batch)
            ep_numbers  = ','.join(str(v['ep_num']) for v in batch)
            first_ep    = batch[0]['ep_num']
            child_id    = f"{safe_cid}-s{season_num:02d}-ep{first_ep:02d}-b{bi+1}"
            child_meta  = {**metadata, 'contentId': content_id or safe_cid}

            children.append({
              'job_id':            child_id,
              'video_url':         url,
              'thumbnail_url':     encode_opts.get('thumbnail_url', ''),
              'seg_duration':      encode_opts.get('seg_duration', '4'),
              'max_encode_height': encode_opts.get('max_encode_height', '720'),
              'metadata':          json.dumps(child_meta),
              'season_number':     str(season_num),
              'episode_number':    ep_numbers,
              'episode_title':     input_ep_title if len(batch) == 1 else '',
              'file_indices':      indices_str,
            })

          if not children:
            print("ERRO: nenhum filho preparado")
            sys.exit(1)

          storage_token = os.environ.get('STORAGE_TOKEN', '')
          github_repo   = os.environ.get('GITHUB_REPOSITORY', '')

          if not storage_token or not github_repo:
            print("ERRO: STORAGE_TOKEN ou GITHUB_REPOSITORY indisponíveis")
            sys.exit(1)

          # FIX 9d (ver cabeçalho do ficheiro): dispara só o PRIMEIRO
          # episódio, com o resto anexado em `chain`. O Coordinator
          # termina logo a seguir a este disparo único.
          def dispatch_first(dispatch_inputs):
            for attempt in range(1, 4):
              r = subprocess.run([
                'curl', '-sf', '-o', '/dev/null', '-w', '%{http_code}', '-X', 'POST',
                '-H', f'Authorization: Bearer {storage_token}',
                '-H', 'Accept: application/vnd.github+json',
                '-H', 'X-GitHub-Api-Version: 2022-11-28',
                f'https://api.github.com/repos/{github_repo}/actions/workflows/process-leve.yml/dispatches',
                '-d', json.dumps({'ref': 'main', 'inputs': dispatch_inputs}),
              ], capture_output=True, text=True)
              code = r.stdout.strip()
              if code == '204':
                print(f"  ✓ Episódio 1/{len(children)} disparado: {dispatch_inputs['job_id']}")
                return True
              elif code.startswith('5') or code == '':
                wait = [10, 25][attempt-1] if attempt <= 2 else 25
                print(f"  ⚠ tentativa {attempt}/3 — HTTP {code or 'sem resposta'} — aguarda {wait}s...")
                time.sleep(wait)
              else:
                print(f"  ✗ erro HTTP {code} (não retry)")
                return False
            print(f"  ✗ falhou após 3 tentativas")
            return False

          parent_job_id = os.environ['JOB_ID_SELF']
          first, rest   = children[0], children[1:]

          dispatch_inputs = {
            'job_id':    first['job_id'],
            'video_url': first['video_url'],
            'metadata':  first['metadata'],
            'episode_info': json.dumps({
              'season_number':  first['season_number'],
              'episode_number': first['episode_number'],
              'episode_title':  first['episode_title'],
              'file_indices':   first['file_indices'],
              'episode_count':  '1',
            }),
            'encode_opts': json.dumps({
              'seg_duration':      first['seg_duration'],
              'max_encode_height': first['max_encode_height'],
              'thumbnail_url':     first['thumbnail_url'],
            }),
            'chain': json.dumps({
              'remaining_children': rest,
              'chain_root_id': parent_job_id,
            }),
          }

          if not dispatch_first(dispatch_inputs):
            print("ERRO: falha ao disparar o primeiro episódio — a cadeia nunca chegou a começar")
            sys.exit(1)

          print(f"\n✅ Coordinator: episódio 1/{len(children)} disparado — ele próprio disparará "
                f"os {len(rest)} restante(s) em cadeia, um de cada vez, nunca em paralelo. "
                f"Coordinator termina aqui.")
          PYEOF

      # FIX 9d (trade-off 1): reporta APENAS falha/cancelamento deste
      # job — sucesso NÃO fecha o job_id que o lote está a rastrear
      # (ver cabeçalho do ficheiro). Se disparou o 1º episódio com
      # sucesso, o jobStore deste job_id fica deliberadamente
      # 'dispatched' — só o ÚLTIMO elo da cadeia (job "process", step
      # "Continuar cadeia sequencial") o fecha como concluído. Isto
      # existe só pra destravar o lote RAPIDAMENTE se o Coordinator em
      # si falhar (ex.: torrent sem seeders, erro de sondagem) — sem
      # isto, uma falha aqui deixaria o lote à espera pra sempre.
      - name: Notificar dispatcher (só em falha — sucesso não fecha o job pai)
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then
            echo "⚠ DISPATCHER_URL não configurado — webhook ignorado"
            exit 0
          fi
          WEBHOOK_URL="${DISPATCHER_URL%/}/webhook"
          echo "→ POST ${WEBHOOK_URL} (job_id=${{ inputs.job_id }}, status=failed)"
          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${ADMIN_API_KEY}" \
            --max-time 20 --retry 2 --retry-delay 3 \
            "${WEBHOOK_URL}" \
            -d "{\"job_id\":\"${{ inputs.job_id }}\",\"status\":\"failed\"}") || true
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "✓ Webhook enviado (HTTP $HTTP_CODE)"
          else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE) — não fatal, resposta:"
            cat /tmp/wh_resp.txt 2>/dev/null || true
          fi

  # ═══════════════════════════════════════════════════════════════════
  # PROCESS — job de encode, timeout inalterado (45min). Roda pra tudo
  # que NÃO passou pelo Coordinator: filme/documentário/dorama, série ou
  # anime por link directo, e qualquer filho de episódio (já vem com
  # file_indices preenchido, então "coordinator" acima é sempre pulado
  # pra ele — ver fix 9b no topo).
  # ═══════════════════════════════════════════════════════════════════
  process:
    needs: coordinator
    if: |
      always() && needs.coordinator.result == 'skipped'
    runs-on: ubuntu-latest
    # CIRÚRGICO: 340 → 45 (ajustado de 30 → 45: job real com download
    # legítimo levou 22min só no download, deixando pouca folga pra
    # probe+encode+thumbnails+encriptação+push+registo). Teto duro do
    # job inteiro — o GitHub Actions cancela sozinho ao atingir esse
    # tempo, independente de qual step está rodando. Última linha de
    # defesa. INALTERADO pelo fix 9b — só o Coordinator ganhou teto
    # próprio, este job de encode continua exactamente como sempre foi.
    timeout-minutes: 45
    # actions:write — necessário pro novo step "Continuar cadeia
    # sequencial" (fix 9d), que precisa de disparar o próximo episódio
    # da cadeia usando o GITHUB_TOKEN automático, exactamente como o
    # Coordinator já fazia. Só entra em uso quando este job faz parte de
    # uma cadeia (`chain.chain_root_id` não vazio) — pra submissões
    # normais (filme/doc/dorama, série via link directo) o step não faz
    # nada, mas a permissão precisa de estar declarada ao nível do job
    # de qualquer forma.
    permissions:
      actions: write
      contents: read

    env:
      WORK_DIR:       /tmp/sv_work/${{ inputs.job_id }}
      CHACHA_KEY:     ${{ secrets.CHACHA_KEY }}
      PIPELINE_API:   ${{ secrets.PIPELINE_API }}
      ADMIN_API_KEY:  ${{ secrets.ADMIN_API_KEY }}
      DISPATCHER_URL: ${{ secrets.DISPATCHER_URL }}

    steps:
      # ── 0. Preparar ambiente ─────────────────────────────────────────────
      - name: Preparar ambiente
        env:
          INPUT_EPISODE_INFO: ${{ inputs.episode_info }}
          INPUT_ENCODE_OPTS:  ${{ inputs.encode_opts }}
        run: |
          python3 << 'PYEOF'
          import os, json
          try:    episode_info = json.loads(os.environ.get('INPUT_EPISODE_INFO', '') or '{}')
          except: episode_info = {}
          try:    encode_opts  = json.loads(os.environ.get('INPUT_ENCODE_OPTS', '') or '{}')
          except: encode_opts = {}

          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"SEASON_NUMBER={episode_info.get('season_number', '0')}\n")
            f.write(f"EPISODE_NUMBER={episode_info.get('episode_number', '')}\n")
            f.write(f"EPISODE_TITLE={episode_info.get('episode_title', '')}\n")
            f.write(f"FILE_INDICES={episode_info.get('file_indices', '')}\n")
            f.write(f"SEG_DURATION={encode_opts.get('seg_duration', '4')}\n")
            f.write(f"MAX_H={encode_opts.get('max_encode_height', '720')}\n")
            f.write(f"THUMBNAIL_URL={encode_opts.get('thumbnail_url', '')}\n")
          PYEOF
          echo "JOB_ID=${{ inputs.job_id }}" >> $GITHUB_ENV
          mkdir -p "/tmp/sv_work/${{ inputs.job_id }}/incoming" \
                   "/tmp/sv_work/${{ inputs.job_id }}/hls" \
                   "/tmp/sv_work/${{ inputs.job_id }}/thumbs"

      # TROCA aria2 (era: ffmpeg + python3-libtorrent)
      - name: Instalar pacotes apt (ffmpeg + aria2, cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg aria2
          version: 1.0
          # FIX: a ação restaura pacotes via dpkg -x (só extrai arquivos),
          # sem rodar scripts de pós-instalação por padrão — isso deixava
          # bibliotecas transitivas fora do cache do linker (ldconfig),
          # causando "error while loading shared libraries" no ffprobe/
          # ffmpeg. execute_install_scripts roda esses scripts no
          # restore, incluindo a atualização do ldconfig.
          execute_install_scripts: true

      - name: Atualizar cache do linker (ldconfig)
        run: sudo ldconfig

      - name: Instalar dependências Python (pip) + verificar aria2
        run: |
          pip install --quiet --upgrade cryptography
          ffmpeg -version | head -1
          aria2c --version | head -1

      # ═══════════════════════════════════════════════════════════════════
      # DOWNLOAD / ENCODE / ENCRIPTAÇÃO
      # ═══════════════════════════════════════════════════════════════════

      - name: '[Modo A] Descarregar vídeo'
        if: inputs.video_url != ''
        run: |
          URL="${{ inputs.video_url }}"
          DEST="$WORK_DIR/incoming"
          mkdir -p "$DEST"

          if [[ "$URL" == magnet:* ]] || [[ "$URL" == *.torrent ]] || [[ "$URL" == *infohash:* ]]; then
            echo "→ Modo torrent (aria2c) — magnet já validado/normalizado pelo Worker de ingest"
            echo "[bitTorrent] engine=aria2"
            echo "[bitTorrent] metadata requested"

            SELECT_ARGS=()
            if [ -n "$FILE_INDICES" ]; then
              echo "  Modo worker — file_indices (1-indexed, convenção aria2): $FILE_INDICES"
              SELECT_ARGS=(--select-file="$FILE_INDICES")
            fi

            # Sem loop de polling próprio nem abort cedo por peers/DHT —
            # aria2c faz metadata+download num único comando (magnet ou
            # .torrent), e --summary-interval já imprime progresso
            # periódico (peers, DL speed) no log deste step. Quem decide
            # "desistir" é sempre o timeout-minutes: 45 do job inteiro —
            # a mesma filosofia do fix cirúrgico #4 do cabeçalho (não dá
            # pra prever com confiança quando um torrent vai achar seed).
            if aria2c \
                --dir="$DEST" \
                --enable-dht=true \
                --enable-dht6=false \
                --bt-enable-lpd=true \
                --seed-time=0 \
                --max-overall-upload-limit=1K \
                --bt-tracker-timeout=15 \
                --summary-interval=30 \
                --console-log-level=notice \
                --file-allocation=none \
                --continue=true \
                "${SELECT_ARGS[@]}" \
                "$URL"; then
              echo "[bitTorrent] download finalizado — ver peers/seeds no log do aria2c acima"
            else
              echo "ERRO: aria2c falhou a descarregar o torrent/magnet (não é problema de "
              echo "normalização — o Worker de ingest já validou a estrutura do magnet; isto é"
              echo "disponibilidade de peers/trackers, ou torrent inexistente)"
              exit 1
            fi

            find "$DEST" -type f | sed 's/^/  → /'
          else
            echo "→ Modo URL directa (curl)"
            curl -L --retry 3 --retry-delay 5 --progress-bar --fail \
              -o "$DEST/input.video" \
              "$URL"
            SIZE=$(stat -c%s "$DEST/input.video" 2>/dev/null || echo 0)
            echo "✓ Download: $(du -sh $DEST/input.video | cut -f1) ($SIZE bytes)"
            if [ "$SIZE" -lt 10000 ]; then
              echo "⚠ Ficheiro demasiado pequeno — download falhou"
              cat "$DEST/input.video" || true
              exit 1
            fi
          fi

      - name: '[Modo B] Obter vídeo via Artifact'
        if: inputs.video_url == ''
        uses: actions/download-artifact@v4
        with:
          name: video-${{ inputs.job_id }}
          path: ${{ env.WORK_DIR }}/incoming/

      - name: Detectar ficheiro de vídeo (+ extrair .rar/.zip se necessário)
        run: |
          VIDEO_EXTS="mp4 mkv avi mov wmv flv ts m4v webm mpg mpeg video"
          if [ -n "$FILE_INDICES" ]; then
            echo "→ Modo worker | file_indices (1-indexed, aria2): $FILE_INDICES"
          fi

          find_video() {
            for ext in $VIDEO_EXTS; do
              FOUND=$(find "$WORK_DIR/incoming/" -iname "*.${ext}" | head -1)
              if [ -n "$FOUND" ]; then echo "$FOUND"; return; fi
            done
          }

          VIDEO_PATH=$(find_video)

          if [ -z "$VIDEO_PATH" ]; then
            echo "Nenhum vídeo directo — procurando arquivos comprimidos..."
            RAR_FILES=$(find "$WORK_DIR/incoming/" -iname "*.rar" | head -1)
            ZIP_FILES=$(find "$WORK_DIR/incoming/" -iname "*.zip" | head -1)
            TAR_FILES=$(find "$WORK_DIR/incoming/" -iname "*.tar*" | head -1)

            if [ -n "$RAR_FILES" ]; then
              echo "→ Encontrado .rar: $RAR_FILES"
              sudo apt-get install -y --no-install-recommends unrar-free 2>/dev/null || \
              sudo apt-get install -y --no-install-recommends unrar 2>/dev/null || true
              EXTRACT_DIR="$WORK_DIR/incoming/extracted"
              mkdir -p "$EXTRACT_DIR"
              if command -v unrar &>/dev/null; then
                unrar x -o+ "$RAR_FILES" "$EXTRACT_DIR/" && echo "✓ unrar concluído"
              elif command -v unrar-free &>/dev/null; then
                unrar-free -x "$RAR_FILES" "$EXTRACT_DIR/" && echo "✓ unrar-free concluído"
              else
                echo "  unrar não disponível — tentando bsdtar"
                bsdtar -x -f "$RAR_FILES" "$EXTRACT_DIR/" && echo "✓ bsdtar concluído"
              fi
              VIDEO_PATH=$(find_video)
            elif [ -n "$ZIP_FILES" ]; then
              echo "→ Encontrado .zip: $ZIP_FILES"
              EXTRACT_DIR="$WORK_DIR/incoming/extracted"
              mkdir -p "$EXTRACT_DIR"
              unzip -o "$ZIP_FILES" -d "$EXTRACT_DIR/"
              VIDEO_PATH=$(find_video)
            elif [ -n "$TAR_FILES" ]; then
              echo "→ Encontrado .tar: $TAR_FILES"
              EXTRACT_DIR="$WORK_DIR/incoming/extracted"
              mkdir -p "$EXTRACT_DIR"
              tar -xf "$TAR_FILES" -C "$EXTRACT_DIR/"
              VIDEO_PATH=$(find_video)
            fi
          fi

          if [ -z "$VIDEO_PATH" ]; then
            echo "ERRO: nenhum vídeo encontrado após extracção"
            find "$WORK_DIR/incoming/" -type f | head -20
            exit 1
          fi

          echo "VIDEO_PATH=$VIDEO_PATH" >> $GITHUB_ENV
          echo "✓ Vídeo: $VIDEO_PATH ($(du -sh "$VIDEO_PATH" | cut -f1))"

      - name: Probe do vídeo
        run: |
          ffprobe -v quiet -print_format json -show_streams -show_format "$VIDEO_PATH" > "$WORK_DIR/probe.json"
          python3 << 'PYEOF'
          import json, os
          d     = json.load(open(os.environ['WORK_DIR'] + '/probe.json'))
          vs    = next((s for s in d['streams'] if s['codec_type'] == 'video'), {})
          as_   = next((s for s in d['streams'] if s['codec_type'] == 'audio'), {})
          fmt   = d['format']
          num, den = map(int, vs.get('r_frame_rate','24/1').split('/'))
          fps        = num / den if den else num
          src_codec  = vs.get('codec_name', 'unknown')
          audio_codec = as_.get('codec_name', 'unknown')
          probe = {
            'duration': float(fmt.get('duration', 0)),
            'width':    vs.get('width',  1920),
            'height':   vs.get('height', 1080),
            'codec':    src_codec,
            'audio_codec': audio_codec,
            'fps':      fps,
            'bitrate':  int(fmt.get('bit_rate', 0)),
          }
          json.dump(probe, open(os.environ['WORK_DIR'] + '/probe_parsed.json','w'))
          max_h = int(os.environ['MAX_H'])
          stream_copy = (src_codec == 'h264')
          if stream_copy:
            eff_h      = probe['height']
            eff_w      = probe['width']
            will_scale = False
          else:
            eff_h      = min(probe['height'], max_h)
            will_scale = probe['height'] > max_h
            eff_w      = round((probe['width'] / probe['height']) * eff_h / 2) * 2 if will_scale else probe['width']
          audio_copy = (audio_codec == 'aac')
          h     = eff_h
          label = ('4k' if h>=2160 else '1440p' if h>=1440 else '1080p' if h>=1080 else '720p' if h>=720 else f'{h}p')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"PROBE_DURATION={probe['duration']}\n")
            f.write(f"PROBE_WIDTH={probe['width']}\n")
            f.write(f"PROBE_HEIGHT={probe['height']}\n")
            f.write(f"PROBE_CODEC={probe['codec']}\n")
            f.write(f"PROBE_AUDIO_CODEC={audio_codec}\n")
            f.write(f"PROBE_FPS={fps}\n")
            f.write(f"PROBE_BITRATE={probe['bitrate']}\n")
            f.write(f"EFF_HEIGHT={eff_h}\n")
            f.write(f"EFF_WIDTH={eff_w}\n")
            f.write(f"WILL_SCALE={'true' if will_scale else 'false'}\n")
            f.write(f"QUALITY_LABEL={label}\n")
            f.write(f"AUDIO_COPY={'true' if audio_copy else 'false'}\n")
            f.write(f"STREAM_COPY={'true' if stream_copy else 'false'}\n")
          print(f"✓ {probe['width']}x{probe['height']} | codec: {src_codec} | audio: {audio_codec} | {fps:.2f}fps | {probe['duration']:.1f}s")
          print(f"  → encode {eff_w}x{eff_h} ({label}) | rescale: {will_scale} | stream_copy(v): {stream_copy} | stream_copy(a): {audio_copy}")
          PYEOF

      - name: HLS encode (stream copy se h264 nativo, senão libx264 ultrafast CRF26)
        run: |
          HLS_DIR="$WORK_DIR/hls"
          GOP=$(python3 -c "import math; print(int(math.ceil(${PROBE_FPS} * ${SEG_DURATION})))")

          if [ "$STREAM_COPY" = "true" ]; then
            echo "  → Vídeo: STREAM_COPY (fonte já é h264, sem reescala)"
            VCODEC_ARGS="-c:v copy"
          else
            echo "  → Vídeo: re-encode necessário (codec=${PROBE_CODEC} ou reescala=${WILL_SCALE})"
            if [ "$WILL_SCALE" = "true" ]; then
              SCALE_ARGS="-vf scale=-2:${EFF_HEIGHT}"
            else
              SCALE_ARGS=""
            fi
            VCODEC_ARGS="$SCALE_ARGS -c:v libx264 -preset ultrafast -crf 26 -tune fastdecode -profile:v high -level 4.0 -pix_fmt yuv420p -g $GOP -keyint_min ${SEG_DURATION}"
          fi

          if [ "$AUDIO_COPY" = "true" ]; then
            echo "  → Áudio: STREAM_COPY (fonte já é AAC)"
            ACODEC_ARGS="-c:a copy"
          else
            echo "  → Áudio: re-encode pra AAC necessário (codec fonte=${PROBE_AUDIO_CODEC})"
            ACODEC_ARGS="-c:a aac -b:a 128k -ac 2"
          fi

          echo "  GOP=$GOP frames (${PROBE_FPS}fps × ${SEG_DURATION}s) — GOP só se aplica quando vídeo está em re-encode"

          run_encode() {
            ffmpeg -hide_banner -loglevel warning -stats \
              -i "$VIDEO_PATH" \
              $VCODEC_ARGS \
              $ACODEC_ARGS \
              -f hls \
              -hls_time ${SEG_DURATION} \
              -hls_playlist_type vod \
              -hls_segment_type fmp4 \
              -hls_fmp4_init_filename "init.mp4" \
              -hls_flags independent_segments \
              -hls_segment_filename "$HLS_DIR/seg%05d.m4s" \
              -y "$HLS_DIR/index.m3u8"
          }

          if ! run_encode; then
            if [ "$STREAM_COPY" = "true" ] || [ "$AUDIO_COPY" = "true" ]; then
              echo "  ⚠ Encode com stream copy falhou (container incompatível) — fallback pra re-encode completo (vídeo + áudio)"
              rm -f "$HLS_DIR"/*.m4s "$HLS_DIR/init.mp4" "$HLS_DIR/index.m3u8" 2>/dev/null || true
              if [ "$WILL_SCALE" = "true" ]; then
                SCALE_ARGS="-vf scale=-2:${EFF_HEIGHT}"
              else
                SCALE_ARGS=""
              fi
              VCODEC_ARGS="$SCALE_ARGS -c:v libx264 -preset ultrafast -crf 26 -tune fastdecode -profile:v high -level 4.0 -pix_fmt yuv420p -g $GOP -keyint_min ${SEG_DURATION}"
              ACODEC_ARGS="-c:a aac -b:a 128k -ac 2"
              run_encode
            else
              echo "✗ Encode falhou (modo re-encode, sem fallback disponível)"
              exit 1
            fi
          fi

          echo "✓ $(ls $HLS_DIR/*.m4s | wc -l) segmentos .m4s gerados"
          echo "✓ init.mp4: $(du -sh $HLS_DIR/init.mp4 | cut -f1)"

      - name: Obter thumbnails
        env:
          INPUT_THUMBNAIL_URL: ${{ env.THUMBNAIL_URL }}
        run: |
          python3 << 'PYEOF'
          import subprocess, os, json
          thumb_dir = os.environ['WORK_DIR'] + '/thumbs'
          duration  = float(os.environ['PROBE_DURATION'])
          video     = os.environ['VIDEO_PATH']
          thumb_url = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()
          thumbs    = []

          def detect_image_ext(path):
            with open(path, 'rb') as f:
              h = f.read(16)
            if h[:3] == b'\xff\xd8\xff':                                    return 'jpg'
            if h[:4] == b'\x89PNG':                                          return 'png'
            if h[:4] == b'RIFF' and len(h) >= 12 and h[8:12] == b'WEBP':     return 'webp'
            if h[:4] == b'RIFF':                                             return 'webp'
            if h[:6] in (b'GIF87a', b'GIF89a'):                              return 'gif'
            if h[:2] == b'BM':                                               return 'bmp'
            if h[:4] in (b'II*\x00', b'MM\x00*'):                            return 'tiff'
            if len(h) >= 12 and h[4:8] == b'ftyp':                           return 'heic'
            return 'jpg'

          def is_valid_image(path, min_bytes=5000):
            if not os.path.exists(path): return False
            if os.path.getsize(path) < min_bytes: return False
            with open(path, 'rb') as f:
              h = f.read(12)
            return (h[:3] == b'\xff\xd8\xff' or h[:4] == b'\x89PNG' or h[:4] == b'RIFF' or
                    h[:6] in (b'GIF87a', b'GIF89a') or h[:2] == b'BM' or
                    h[:4] in (b'II*\x00', b'MM\x00*') or
                    (len(h) >= 8 and h[4:8] == b'ftyp'))

          def finalize_thumb(tmp_path, index=0, time_s=0):
            ext = detect_image_ext(tmp_path)
            final_path = f"{thumb_dir}/thumb_{index}.{ext}"
            if tmp_path != final_path:
              os.replace(tmp_path, final_path)
            return final_path, ext

          def extract_frame(video, out_path, time_pct=0.07):
            t = max(1.0, duration * time_pct)
            r = subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-ss',f'{t:.2f}',
              '-i',video,'-vframes','1','-vf','scale=1280:-2','-q:v','2','-y',out_path], capture_output=True)
            return r.returncode == 0 and is_valid_image(out_path)

          if thumb_url:
            tmp = f"{thumb_dir}/thumb_0.tmp"
            print(f"  Descarregando thumbnail: {thumb_url}")
            subprocess.run(['curl','-sL','--retry','2','--retry-delay','2','--max-time','15',
              '-H','User-Agent: Mozilla/5.0','-o',tmp,thumb_url], capture_output=True)
            if is_valid_image(tmp):
              final_path, ext = finalize_thumb(tmp, 0)
              thumbs.append({'path':final_path,'ext':ext,'time':0,'index':0})
              print(f"✓ Thumbnail válida ({os.path.getsize(final_path)//1024} KB, .{ext})")
            else:
              if os.path.exists(tmp): os.remove(tmp)
              out = f"{thumb_dir}/thumb_0.jpg"
              if extract_frame(video, out):
                thumbs.append({'path':out,'ext':'jpg','time':0,'index':0})
                print(f"✓ Frame extraído como fallback")
              else: print('✗ Falha ao extrair frame')
          else:
            out = f"{thumb_dir}/thumb_0.jpg"
            print(f"  Extraindo frame a 7% ({duration*0.07:.1f}s)")
            if extract_frame(video, out, time_pct=0.07):
              thumbs.append({'path':out,'ext':'jpg','time':duration*0.07,'index':0})
              print(f"✓ Frame extraído: {os.path.getsize(out)//1024} KB")
            elif extract_frame(video, out, time_pct=0.05):
              thumbs.append({'path':out,'ext':'jpg','time':duration*0.05,'index':0})
              print(f"✓ Frame extraído a 5%: {os.path.getsize(out)//1024} KB")
            else: print('✗ Não foi possível extrair frame')

          json.dump(thumbs, open(os.environ['WORK_DIR'] + '/thumbs_manifest.json', 'w'))
          print(f"✓ {len(thumbs)} thumbnail(s)")
          PYEOF

      - name: Encriptar segmentos → .bin
        run: |
          python3 << 'PYEOF'
          import os, json, secrets, struct
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms
          key_hex = os.environ['CHACHA_KEY']
          if len(key_hex) != 64: raise ValueError('CHACHA_KEY inválido')
          key     = bytes.fromhex(key_hex)
          hls_dir = os.environ['WORK_DIR'] + '/hls'
          CHUNK_SIZE = 65536

          def encrypt_segment(data, key):
            chunks = [data[i:i+CHUNK_SIZE] for i in range(0, len(data), CHUNK_SIZE)]
            out    = [struct.pack('<I', len(chunks))]
            for chunk in chunks:
              nonce       = secrets.token_bytes(12)
              nonce_field = struct.pack('<I', 1) + nonce
              ct          = Cipher(algorithms.ChaCha20(key, nonce_field), None).encryptor().update(chunk)
              out.append(nonce)
              out.append(struct.pack('<I', len(ct)))
              out.append(ct)
            return b''.join(out)

          nonce_map = {}
          init_src  = os.path.join(hls_dir, 'init.mp4')
          if os.path.exists(init_src):
            with open(init_src, 'rb') as f: data = f.read()
            encrypted = encrypt_segment(data, key)
            with open(os.path.join(hls_dir, 'init.bin'), 'wb') as f: f.write(encrypted)
            os.remove(init_src)
            nonce_map['init.bin'] = f"chunked:{struct.unpack('<I', encrypted[:4])[0]}"
            print(f"  init.mp4 → init.bin ({len(data)//1024}KB)")

          seg_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.m4s'))
          if not seg_files: raise RuntimeError('Nenhum .m4s encontrado')

          for fname in seg_files:
            with open(os.path.join(hls_dir, fname), 'rb') as f: data = f.read()
            encrypted = encrypt_segment(data, key)
            bin_name = fname.replace('.m4s', '.bin')
            with open(os.path.join(hls_dir, bin_name), 'wb') as f: f.write(encrypted)
            os.remove(os.path.join(hls_dir, fname))
            nonce_map[bin_name] = f"chunked:{struct.unpack('<I', encrypted[:4])[0]}"

          out = {'key_id': os.environ['CHACHA_KEY'][:8], 'format': 'chunk-v2', 'nonces': nonce_map}
          json.dump(out, open(os.environ['WORK_DIR'] + '/nonces.json','w'))
          print(f"✓ {len(seg_files)} segmentos encriptados")
          PYEOF

      - name: Libertar espaço — remover vídeo fonte e temporários de torrent
        if: always()
        run: |
          echo "Espaço em disco antes da limpeza:"
          df -h "$WORK_DIR" 2>/dev/null | tail -1 || true
          rm -rf "$WORK_DIR/incoming"
          rm -rf /tmp/coord_meta
          echo "✓ Vídeo fonte e ficheiros temporários de torrent removidos"
          echo "Espaço em disco depois da limpeza:"
          df -h "$WORK_DIR" 2>/dev/null | tail -1 || true

      # ═══════════════════════════════════════════════════════════════════
      # STORAGE (conta separada) — token de instalação da App gerado TARDE,
      # só agora (após encode/thumbnails/encriptação), nunca no início
      # ═══════════════════════════════════════════════════════════════════
      - name: Gerar token de instalação da App (conta de storage)
        env:
          STORAGE_OWNER:          ${{ secrets.STORAGE_OWNER }}
          STORAGE_APP_ID:         ${{ secrets.STORAGE_APP_ID }}
          STORAGE_INSTALLATION_ID: ${{ secrets.STORAGE_INSTALLATION_ID }}
          STORAGE_PRIVATE_KEY:    ${{ secrets.STORAGE_PRIVATE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, time, json, base64, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          target_owner    = os.environ['STORAGE_OWNER']
          app_id          = os.environ['STORAGE_APP_ID']
          installation_id = os.environ['STORAGE_INSTALLATION_ID']
          private_key_pem = os.environ['STORAGE_PRIVATE_KEY']

          if not all([target_owner, app_id, installation_id, private_key_pem]):
            print("ERRO: alguma credencial da App de storage ficou vazia — confira os secrets STORAGE_OWNER/APP_ID/INSTALLATION_ID/PRIVATE_KEY.")
            raise SystemExit(1)

          def b64url(data: bytes) -> str:
            return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          now    = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          payload = {"iat": now - 60, "exp": now + 9 * 60, "iss": app_id}
          signing_input = f"{b64url(json.dumps(header).encode())}.{b64url(json.dumps(payload).encode())}"

          key = serialization.load_pem_private_key(private_key_pem.encode(), password=None)
          signature = key.sign(signing_input.encode(), padding.PKCS1v15(), hashes.SHA256())
          jwt_token = f"{signing_input}.{b64url(signature)}"

          req = urllib.request.Request(
            f"https://api.github.com/app/installations/{installation_id}/access_tokens",
            method="POST",
            headers={
              "Authorization":        f"Bearer {jwt_token}",
              "Accept":               "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
          )
          try:
            with urllib.request.urlopen(req, timeout=20) as r:
              data = json.loads(r.read())
          except urllib.error.HTTPError as e:
            print(f"ERRO: falha ao gerar installation token: HTTP {e.code} {e.read().decode()[:300]}")
            raise SystemExit(1)

          token = data['token']
          print(f"::add-mask::{token}")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"STORAGE_TARGET_OWNER={target_owner}\n")
            f.write(f"STORAGE_TARGET_TOKEN={token}\n")
          print(f"✓ Token de instalação gerado para conta de storage: {target_owner} (expira {data['expires_at']})")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════
      # GIT-SHARD — inalterado.
      # ═══════════════════════════════════════════════════════════════════

      - name: Definir branch exclusiva do job
        run: |
          python3 << 'PYEOF'
          import os, re
          job_id = os.environ['JOB_ID']
          safe = re.sub(r'[^A-Za-z0-9._-]', '-', job_id)
          safe = re.sub(r'\.{2,}', '.', safe).strip('.-')
          if not safe:
            safe = 'job'
          branch = f"job-{safe}"
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"JOB_BRANCH={branch}\n")
          print(f"✓ Branch exclusiva do job: {branch}")
          PYEOF

      - name: Escolher shard, gerar URLs e enviar (com fallback automático de shard cheio)
        env:
          STORAGE_TOKEN: ${{ env.STORAGE_TARGET_TOKEN }}
          STORAGE_OWNER: ${{ env.STORAGE_TARGET_OWNER }}
          STORAGE_CREATE_PAT: ${{ secrets.STORAGE_CREATE_PAT }}
        run: |
          git config --global core.deltaBaseCacheLimit 2047m
          git config --global core.looseObjects 0
          git config --global pack.compression 0
          git config --global pack.window 0
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global repack.useDeltaBaseOffset true
          git config --global advice.detachedHead false

          python3 << 'PYEOF'
          import os, subprocess, json, time, random, re, shutil

          THRESHOLD_KB       = 3_500 * 1024
          MAX_SHARDS_TO_SCAN = 20
          MAX_SHARD_ATTEMPTS = 5
          BATCH_SIZE         = 400

          owner      = os.environ['STORAGE_OWNER']
          token      = os.environ['STORAGE_TOKEN']
          work_dir   = os.environ['WORK_DIR']
          job_id     = os.environ['JOB_ID']
          job_branch = os.environ['JOB_BRANCH']
          eff_w      = os.environ['EFF_WIDTH']
          eff_h      = os.environ['EFF_HEIGHT']
          seg_duration = int(os.environ['SEG_DURATION'])

          hls_dir    = work_dir + '/hls'
          orig_index = hls_dir + '/index.m3u8.orig'
          shutil.copy(hls_dir + '/index.m3u8', orig_index)

          def api(method, path, data=None):
            cmd = ['curl','-s','-L','-w','\n%{http_code}','-X',method,
                   '-H',f'Authorization: Bearer {token}',
                   '-H','Accept: application/vnd.github+json',
                   f'https://api.github.com{path}']
            if data is not None:
              cmd += ['-d', json.dumps(data)]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            if '\n' in out:
              body, _, code = out.rpartition('\n')
            else:
              body, code = '', out
            try:
              return int(code.strip()), body
            except ValueError:
              return 0, body

          def get_repo_size_kb(repo, max_attempts=4):
            last_code = 0
            for attempt in range(1, max_attempts + 1):
              code, out = api('GET', f'/repos/{owner}/{repo}')
              if code == 200:
                return True, json.loads(out).get('size', 0)
              if code == 404:
                return False, 0
              last_code = code
              wait = [3, 8, 15, 25][min(attempt - 1, 3)]
              print(f"  ⚠ GET {repo} → HTTP {code or 'sem resposta'} (não é 404, pode ser transitório) — tentativa {attempt}/{max_attempts}, aguarda {wait}s...")
              time.sleep(wait)
            print(f"  ✗ GET {repo} falhou persistentemente após {max_attempts} tentativas (último HTTP {last_code})")
            return None, 0

          def create_repo(repo):
            create_pat = os.environ.get('STORAGE_CREATE_PAT', '')
            if not create_pat:
              print(f"  ✗ STORAGE_CREATE_PAT não configurado — impossível criar {repo} (installation token de App não cria repos em conta pessoal)")
              return False
            cmd = ['curl','-s','-w','\n%{http_code}','-X','POST',
                   '-H',f'Authorization: Bearer {create_pat}',
                   '-H','Accept: application/vnd.github+json',
                   'https://api.github.com/user/repos',
                   '-d', json.dumps({'name': repo, 'private': False, 'auto_init': True})]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            body, _, code_str = out.rpartition('\n') if '\n' in out else ('', '', out)
            try: cc = int(code_str.strip())
            except ValueError: cc = 0
            if cc == 201:
              return True
            if cc == 422:
              print(f"  ⚠ {repo} já existe (criado concorrentemente por outro job) — reutilizando")
              return True
            print(f"  ✗ Falha ao criar {repo}: HTTP {cc} {body[:200]}")
            return False

          def pick_shard(exclude):
            eligible = []
            n = 1
            while n <= MAX_SHARDS_TO_SCAN:
              repo = f'compiled{n:02d}'
              if repo in exclude:
                n += 1
                continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None:
                raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe ainda, a criar...")
                if not create_repo(repo):
                  raise SystemExit(1)
                return repo
              size_mb = size_kb // 1024
              print(f"  {repo}: {size_mb}MB")
              if size_kb < THRESHOLD_KB:
                eligible.append(repo)
              n += 1

            if eligible:
              chosen = random.choice(eligible)
              print(f"  → {len(eligible)} shard(s) elegível(eis): {eligible} — escolhido aleatoriamente: {chosen}")
              return chosen

            print(f"  → nenhum shard no range 1..{MAX_SHARDS_TO_SCAN} tem espaço — procurando além disso...")
            HARD_CEILING = 200
            while n <= HARD_CEILING:
              repo = f'compiled{n:02d}'
              if repo in exclude:
                n += 1
                continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None:
                raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe — a criar...")
                if not create_repo(repo):
                  raise SystemExit(1)
                return repo
              size_mb = size_kb // 1024
              if size_kb < THRESHOLD_KB:
                print(f"  → {repo} já existe e tem espaço ({size_mb}MB) — reutilizando")
                return repo
              print(f"  {repo}: {size_mb}MB — cheio, avançando pro próximo número")
              n += 1

            print(f"  ✗ Nenhum slot de shard livre até compiled{HARD_CEILING:02d}")
            raise SystemExit(1)

          def rewrite_urls(shard):
            raw_base = f"https://cdn.jsdelivr.net/gh/{owner}/{shard}@{job_branch}/{job_id}"
            with open(orig_index) as f:
              content = f.read()
            content = re.sub(r'#EXT-X-MAP:URI="init\.mp4"',
                              f'#EXT-X-MAP:URI="{raw_base}/hls/init.bin"', content)
            content = re.sub(r'^(seg\d+)\.m4s$',
                              lambda m: f"{raw_base}/hls/{m.group(1)}.bin",
                              content, flags=re.MULTILINE)
            with open(hls_dir + '/index.m3u8', 'w') as f:
              f.write(content)

            bin_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.bin') and f != 'init.bin')
            if bin_files:
              total_bytes  = sum(os.path.getsize(os.path.join(hls_dir, f)) for f in bin_files)
              duration_s   = len(bin_files) * seg_duration
              real_bitrate = int((total_bytes * 8) / duration_s) if duration_s > 0 else 2000000
            else:
              real_bitrate = int(os.environ.get('PROBE_BITRATE') or 2000000)
            master = '\n'.join(['#EXTM3U', '#EXT-X-VERSION:6', '',
              f'#EXT-X-STREAM-INF:BANDWIDTH={real_bitrate},RESOLUTION={eff_w}x{eff_h}',
              f'{raw_base}/hls/index.m3u8'])
            with open(work_dir + '/master.m3u8', 'w') as f:
              f.write(master)

            nonces = json.load(open(work_dir + '/nonces.json'))
            thumbs_path = work_dir + '/thumbs_manifest.json'
            thumbs = json.load(open(thumbs_path)) if os.path.exists(thumbs_path) else []
            cdn_urls = [f"{raw_base}/master.m3u8", f"{raw_base}/nonces.json",
                        f"{raw_base}/hls/index.m3u8", f"{raw_base}/hls/init.bin"]
            seg_names = sorted(bn for bn in nonces['nonces'] if bn != 'init.bin')
            cdn_urls += [f"{raw_base}/hls/{bn}" for bn in seg_names]
            cdn_urls += [f"{raw_base}/thumbs/{os.path.basename(t['path'])}" for t in thumbs]
            json.dump(cdn_urls, open(work_dir + '/cdn_urls.json', 'w'))
            print(f"✓ URLs geradas pro shard {shard}: master.m3u8 | nonces.json | {len(cdn_urls)} entradas em cdn_urls.json")

          QUOTA_MARKERS = ('size quota', 'pre-receive hook declined', 'repository is above')

          def push_batch(batch_num, total_batches, max_attempts=8):
            for attempt in range(1, max_attempts + 1):
              print(f"→ Lote {batch_num}/{total_batches} — push tentativa {attempt}/{max_attempts}...")
              r = subprocess.run(['git', 'push', '-q', '--force', 'origin', job_branch],
                                  capture_output=True, text=True)
              out = (r.stdout + r.stderr)
              if r.returncode == 0:
                print(f"✓ Lote {batch_num}/{total_batches} enviado (tentativa {attempt})")
                return 'ok'
              if any(m in out.lower() for m in QUOTA_MARKERS):
                print(f"✗ Shard cheio (quota) — erro permanente, não adianta retry: {out.strip()[:300]}")
                return 'quota'
              wait = attempt * 8 + random.randint(0, 10)
              print(f"  ⚠ Push do lote {batch_num} falhou (rede/RPC transitório — branch exclusiva, sem colisão possível) — retry em {wait}s...")
              print(f"  {out.strip()[:300]}")
              time.sleep(wait)
            print(f"✗ Lote {batch_num}/{total_batches} falhou após {max_attempts} tentativas (não relacionado a quota)")
            return 'fail'

          def push_all_batches(shard):
            repo_url = f"https://x-access-token:{token}@github.com/{owner}/{shard}.git"
            shutil.rmtree('/tmp/shard', ignore_errors=True)
            os.makedirs('/tmp/shard')
            os.chdir('/tmp/shard')
            subprocess.run(['git', 'init', '-q'], check=True)
            subprocess.run(['git', 'checkout', '-q', '-b', job_branch], check=True)
            subprocess.run(['git', 'remote', 'add', 'origin', repo_url], check=True)
            os.makedirs(f'{job_id}/hls', exist_ok=True)
            os.makedirs(f'{job_id}/thumbs', exist_ok=True)

            files = sorted(os.path.join('hls', f) for f in os.listdir(hls_dir))
            files += ['master.m3u8', 'nonces.json']
            thumbs_dir = work_dir + '/thumbs'
            if os.path.isdir(thumbs_dir) and os.listdir(thumbs_dir):
              files += sorted(os.path.join('thumbs', f) for f in os.listdir(thumbs_dir))

            total = len(files)
            num_batches = (total + BATCH_SIZE - 1) // BATCH_SIZE
            print(f"→ {total} ficheiro(s) a enviar em {num_batches} lote(s) de até {BATCH_SIZE} na branch {job_branch} (shard {shard})")

            for bi in range(num_batches):
              batch = files[bi*BATCH_SIZE:(bi+1)*BATCH_SIZE]
              for rel in batch:
                os.makedirs(os.path.dirname(f'{job_id}/{rel}') or '.', exist_ok=True)
                shutil.copy(f'{work_dir}/{rel}', f'{job_id}/{rel}')
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'add', job_id], check=True)
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'commit', '-m', f'job={job_id} lote={bi+1}/{num_batches}', '-q'])
              result = push_batch(bi+1, num_batches)
              if result != 'ok':
                os.chdir('/')
                shutil.rmtree('/tmp/shard', ignore_errors=True)
                return result

            os.chdir('/')
            shutil.rmtree('/tmp/shard', ignore_errors=True)
            print(f"✓ Todos os {num_batches} lote(s) enviados para {shard}@{job_branch}: {job_id}")
            return 'ok'

          exclude = set()
          final_shard = None
          for shard_attempt in range(1, MAX_SHARD_ATTEMPTS + 1):
            print(f"════ Shard — tentativa {shard_attempt}/{MAX_SHARD_ATTEMPTS} (excluindo: {sorted(exclude) or '-'}) ════")
            shard = pick_shard(exclude)
            print(f"✓ Shard escolhido: {shard}")
            rewrite_urls(shard)
            result = push_all_batches(shard)
            if result == 'ok':
              final_shard = shard
              break
            elif result == 'quota':
              print(f"  → marcando {shard} como cheio nesta run e tentando outro shard...")
              exclude.add(shard)
            else:
              print(f"✗ Falha não relacionada a quota no shard {shard} — trocar de shard não resolveria, abortando job")
              raise SystemExit(1)

          if not final_shard:
            print(f"✗ Todos os {MAX_SHARD_ATTEMPTS} shards tentados estavam cheios ou indisponíveis — job falhou")
            raise SystemExit(1)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"SHARD_REPO={final_shard}\n")
          print(f"✓ Envio concluído — shard definitivo: {final_shard}")
          PYEOF

      - name: Registar no EdgeOne (Turso + KV)
        continue-on-error: true
        env:
          METADATA:       ${{ inputs.metadata }}
          STORAGE_OWNER:  ${{ env.STORAGE_TARGET_OWNER }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, datetime, time

          pipeline_api = os.environ.get('PIPELINE_API','').rstrip('/')
          if not pipeline_api: print('⚠ PIPELINE_API não configurado'); raise SystemExit(0)

          work_dir     = os.environ['WORK_DIR']
          job_id       = os.environ['JOB_ID']
          quality      = os.environ.get('QUALITY_LABEL', '')
          seg_dur      = int(os.environ.get('SEG_DURATION', '4') or '4')
          storage_owner = os.environ['STORAGE_OWNER']
          shard_repo    = os.environ['SHARD_REPO']
          job_branch    = os.environ['JOB_BRANCH']
          raw_base      = f"https://cdn.jsdelivr.net/gh/{storage_owner}/{shard_repo}@{job_branch}/{job_id}"

          try:    metadata = json.loads(os.environ.get('METADATA','{}'))
          except: metadata = {}

          probe = json.load(open(os.path.join(work_dir, 'probe_parsed.json')))

          eff_w = int(os.environ.get('EFF_WIDTH', '0') or '0')
          eff_h = int(os.environ.get('EFF_HEIGHT', '0') or '0')

          nonces    = json.load(open(os.path.join(work_dir, 'nonces.json')))
          seg_count = len([k for k in nonces['nonces'] if k != 'init.bin'])

          thumbs_path   = os.path.join(work_dir, 'thumbs_manifest.json')
          thumbs        = json.load(open(thumbs_path)) if os.path.exists(thumbs_path) else []
          thumb_urls    = [f"{raw_base}/thumbs/{os.path.basename(t['path'])}" for t in thumbs]

          cdn_urls_path = os.path.join(work_dir, 'cdn_urls.json')
          cdn_urls      = json.load(open(cdn_urls_path)) if os.path.exists(cdn_urls_path) else []

          content_id = metadata.get('contentId', job_id)
          if not metadata.get('contentId'):
            print(f"⚠⚠ contentId ausente no metadata — usando job_id ('{content_id}') como contentId. "
                  f"Isso impede o backend de agrupar este episódio com outros da mesma série no catálogo. "
                  f"Corrija na origem (dispatcher/coordinator) pra sempre enviar o mesmo contentId entre "
                  f"episódios da mesma série/filme.")

          season_number_env  = os.environ.get('SEASON_NUMBER', '0') or '0'
          episode_number_env = os.environ.get('EPISODE_NUMBER', '') or ''
          episode_title_env  = os.environ.get('EPISODE_TITLE', '') or ''

          body = {
            'contentId':content_id,'title':metadata.get('title','Untitled'),'description':metadata.get('description',''),
            'type':metadata.get('type','movie'),'year':int(metadata.get('year') or datetime.datetime.now().year),
            'lang':metadata.get('lang','en'),'duration':round(probe.get('duration', 0)),'thumbnail':thumb_urls[0] if thumb_urls else '',
            'thumbnails':thumb_urls,'qualities':[quality] if quality else [],'width':eff_w,'height':eff_h,'codec':'h264','fps':probe.get('fps', 24),
            'bitrate':probe.get('bitrate', 0),'segmentCount':seg_count,'segDuration':seg_dur,'videoID':job_id,'cdnUrls':cdn_urls,
            'encrypted':True,'encryption':'chacha20-chunk-v2','container':'fmp4','segExt':'bin',
            'masterUrl':f"{raw_base}/master.m3u8",'noncesUrl':f"{raw_base}/nonces.json",
            'storageRepo': shard_repo, 'storageOwner': storage_owner, 'storageBranch': job_branch,
            'seasonNumber':season_number_env,'episodeNumber':episode_number_env,'episodeTitle':episode_title_env,
          }
          payload = json.dumps(body).encode()
          for attempt in range(1, 6):
            req = urllib.request.Request(f"{pipeline_api}/api/pipeline/register", data=payload,
              headers={'Content-Type':'application/json','X-API-Key':os.environ.get('ADMIN_API_KEY','')}, method='POST')
            try:
              with urllib.request.urlopen(req, timeout=30) as r: print(f"✓ Conteúdo registado ({r.status})"); break
            except urllib.error.HTTPError as e:
              if e.code < 500 and e.code != 429: print(f"  Erro cliente ({e.code})"); break
              print(f"⚠ Tentativa {attempt} — HTTP {e.code}")
            except Exception as e: print(f"⚠ Tentativa {attempt} — {e}")
            if attempt < 5:
              time.sleep([5,10,20,40][attempt-1])
          print("✓ Registo concluído")
          PYEOF

      - name: Notificar dispatcher (webhook FIFO)
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then
            echo "⚠ DISPATCHER_URL não configurado — webhook ignorado"
            exit 0
          fi
          EFFECTIVE_JOB_ID="${JOB_ID:-${{ inputs.job_id }}}"
          if [ -z "$EFFECTIVE_JOB_ID" ]; then
            echo "⚠ job_id indisponível — webhook ignorado (não há job pra notificar)"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            WEBHOOK_STATUS="done"
          else
            WEBHOOK_STATUS="failed"
          fi
          WEBHOOK_URL="${DISPATCHER_URL%/}/webhook"
          echo "→ POST ${WEBHOOK_URL} (job_id=${EFFECTIVE_JOB_ID}, status=${WEBHOOK_STATUS})"

          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${ADMIN_API_KEY}" \
            --max-time 20 --retry 2 --retry-delay 3 \
            "${WEBHOOK_URL}" \
            -d "{\"job_id\":\"${EFFECTIVE_JOB_ID}\",\"status\":\"${WEBHOOK_STATUS}\"}") || true

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "✓ Webhook enviado (HTTP $HTTP_CODE)"
          else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE) — não fatal, resposta:"
            cat /tmp/wh_resp.txt 2>/dev/null || true
          fi

      - name: Continuar cadeia sequencial (disparar próximo episódio, se houver)
        if: always()
        continue-on-error: true
        env:
          INPUT_CHAIN:       ${{ inputs.chain }}
          STORAGE_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, time, random

          try:    chain = json.loads(os.environ.get('INPUT_CHAIN', '') or '{}')
          except: chain = {}

          chain_root_id = chain.get('chain_root_id', '') or ''
          remaining     = chain.get('remaining_children', []) or []

          if not chain_root_id:
            print("→ Este job não faz parte de uma cadeia sequencial — nada a fazer.")
            raise SystemExit(0)

          storage_token  = os.environ.get('STORAGE_TOKEN', '')
          github_repo    = os.environ.get('GITHUB_REPOSITORY', '')
          dispatcher_url = os.environ.get('DISPATCHER_URL', '').rstrip('/')
          admin_key      = os.environ.get('ADMIN_API_KEY', '')

          def notify_chain_root(status):
            if not dispatcher_url:
              print(f"  ⚠ DISPATCHER_URL não configurado — não foi possível reportar chain_root_id={chain_root_id}")
              return
            subprocess.run([
              'curl', '-s', '-o', '/dev/null', '-X', 'POST',
              '-H', 'Content-Type: application/json',
              '-H', f'x-api-key: {admin_key}',
              '--max-time', '20', '--retry', '2', '--retry-delay', '3',
              f'{dispatcher_url}/webhook',
              '-d', json.dumps({'job_id': chain_root_id, 'status': status}),
            ], capture_output=True)
            print(f"  → chain_root_id={chain_root_id} reportado como '{status}'")

          if not remaining:
            final_status = 'done' if '${{ job.status }}' == 'success' else 'failed'
            print(f"→ Último episódio da cadeia — a fechar chain_root_id={chain_root_id} como '{final_status}'")
            notify_chain_root(final_status)
            raise SystemExit(0)

          if not storage_token or not github_repo:
            print("  ✗ STORAGE_TOKEN/GITHUB_REPOSITORY indisponíveis — impossível continuar a cadeia")
            notify_chain_root('failed')
            raise SystemExit(0)

          next_child = remaining[0]
          rest_after = remaining[1:]

          gap = random.randint(10 * 60, 30 * 60)
          print(f"  … aguardando {gap // 60}min de folga antes do próximo episódio da cadeia")
          time.sleep(gap)

          dispatch_inputs = {
            'job_id':    next_child['job_id'],
            'video_url': next_child['video_url'],
            'metadata':  next_child['metadata'],
            'episode_info': json.dumps({
              'season_number':  next_child['season_number'],
              'episode_number': next_child['episode_number'],
              'episode_title':  next_child['episode_title'],
              'file_indices':   next_child['file_indices'],
              'episode_count':  '1',
            }),
            'encode_opts': json.dumps({
              'seg_duration':      next_child['seg_duration'],
              'max_encode_height': next_child['max_encode_height'],
              'thumbnail_url':     next_child['thumbnail_url'],
            }),
            'chain': json.dumps({
              'remaining_children': rest_after,
              'chain_root_id': chain_root_id,
            }),
          }

          def dispatch_next():
            for attempt in range(1, 4):
              r = subprocess.run([
                'curl', '-sf', '-o', '/dev/null', '-w', '%{http_code}', '-X', 'POST',
                '-H', f'Authorization: Bearer {storage_token}',
                '-H', 'Accept: application/vnd.github+json',
                '-H', 'X-GitHub-Api-Version: 2022-11-28',
                f'https://api.github.com/repos/{github_repo}/actions/workflows/process-leve.yml/dispatches',
                '-d', json.dumps({'ref': 'main', 'inputs': dispatch_inputs}),
              ], capture_output=True, text=True)
              code = r.stdout.strip()
              if code == '204':
                print(f"  ✓ Próximo episódio da cadeia disparado: {next_child['job_id']} ({len(rest_after)} restante(s) depois dele)")
                return True
              elif code.startswith('5') or code == '':
                wait = [10, 25][attempt-1] if attempt <= 2 else 25
                print(f"  ⚠ tentativa {attempt}/3 — HTTP {code or 'sem resposta'} — aguarda {wait}s...")
                time.sleep(wait)
              else:
                print(f"  ✗ erro HTTP {code} (não retry)")
                return False
            return False

          if dispatch_next():
            print("  → cadeia continua — este job termina aqui, o próximo cuida do resto")
          else:
            skipped = [next_child['job_id']] + [c['job_id'] for c in rest_after]
            print(f"  ✗ Falha ao disparar o próximo episódio da cadeia — {len(skipped)} episódio(s) NUNCA "
                  f"serão disparados: {', '.join(skipped)}")
            notify_chain_root('failed')
          PYEOF

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          rm -rf /tmp/shard
          rm -f /tmp/wh_resp.txt
          rm -rf /tmp/coord_meta
          echo "✓ Workspace limpo"
