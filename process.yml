# ============================================================================
# ARQUIVO LEGADO — StreamVault Process (Leve)  [process.yml / "process-leve"]
# ============================================================================
# CORRECAO DA AUDITORIA FASE 0 (registo historico recuperado do original):
#   Nome real: "StreamVault Process (Leve)" — variante leve do process.yml.
#   Motor BitTorrent anterior: libtorrent -> aria2c (aria2 1.x), segundo o adendo.
#   Arquitetura antiga: branch exclusiva por job, sharding, HLS/.bin, ChaCha20,
#   API de streaming e armazenamento remoto.
#
# DECISAO DE ARQUITETURA (documentada, conforme briefing §7 Fase 0):
#   Este pipeline INTEIRO fica fora do novo fluxo do Motor Inteligente de
#   Downloads. Motivos:
#     1. Viola os principios obrigatorios 1-4 (downloads no servidor/branch
#        em vez do dispositivo do utilizador; uso de storage remoto).
#     2. Baseia-se em aria2c/libtorrent externos e em fragmentacao HLS/.bin +
#        ChaCha20 — incompativel com o nucleo Go modular e verificavel.
#     3. Nenhum componente e reutilizavel: a nova interface Engine (Fase 1)
#        substituira todo o mecanismo; HTTP nativo (Fase 2) e motor BitTorrent
#        via anacrolix/torrent auditado (Fase 3).
#   Substituido progressivamente por `.github/workflows/ci.yml` (novo CI do
#   core Go). Manter este arquivo somente para referencia de auditoria;
#   remover na Fase 12 quando o novo CI estiver operacional.
# ============================================================================
name: legacy-streamvault-quarantine
on: []            # desativado explicitamente — nunca deve executar
jobs:
  quarantine:
    runs-on: ubuntu-latest
    if: false     # dupla guarda: job inerte mesmo se 'on:' for reaberto
    steps:
      - run: echo "Arquivo legado inerte — ver comentarios no topo do ficheiro"
